name: co_stock
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  easy_localization: ^3.0.8
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.4
  freezed_annotation: ^3.1.0
  equatable: ^2.0.8
  fpdart: ^1.2.0
  rxdart: ^0.28.0
  auto_route: ^11.1.0
  async: ^2.13.0
  flutter_keyboard_visibility: ^6.0.0
  path_provider: ^2.1.5
  country_flags: ^4.1.2
  reorderable_grid:
    git:
      url: https://github.com/DolBich/reorderable_grid.git
      ref: on_drop_fork

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  json_serializable: ^6.10.2
  freezed: ^3.2.3
  auto_route_generator: ^10.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  color: '#F57C00'
  android: true
  image: 'assets/images/icons/co_stock_splash_icon.png'
  android_12:
    color: '#F17A05'
    image: 'assets/images/icons/co_stock_splash_icon.png'

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/logos/
    - assets/images/icons/
